name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS only: notarytool --key expects a p8 file path; decode the base64 secret into a file
      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/asc
          echo "${{ secrets.APPLE_API_KEY }}" | base64 -D > /tmp/asc/AuthKey_3474G52856.p8
          echo "APPLE_API_KEY=/tmp/asc/AuthKey_3474G52856.p8" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAIDU_CLIENT_ID: ${{ secrets.BAIDU_CLIENT_ID }}
          BAIDU_CLIENT_SECRET: ${{ secrets.BAIDU_CLIENT_SECRET }}
          BAIDU_REDIRECT_URI: ${{ secrets.BAIDU_REDIRECT_URI }}
          BAIDU_SCOPE: ${{ secrets.BAIDU_SCOPE }}
          # Developer ID signing (p12 exported from keychain) — macOS only
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          # Notarization via App Store Connect API key (path set by Prepare step) — macOS only
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: npm run release
