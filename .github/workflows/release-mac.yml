name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # notarytool --key expects a p8 file path; decode the base64 secret into a file
      - name: Prepare Apple API key
        run: |
          mkdir -p /tmp/asc
          echo "${{ secrets.APPLE_API_KEY }}" | base64 -D > /tmp/asc/AuthKey_3474G52856.p8
          echo "APPLE_API_KEY=/tmp/asc/AuthKey_3474G52856.p8" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAIDU_CLIENT_ID: ${{ secrets.BAIDU_CLIENT_ID }}
          BAIDU_CLIENT_SECRET: ${{ secrets.BAIDU_CLIENT_SECRET }}
          BAIDU_REDIRECT_URI: ${{ secrets.BAIDU_REDIRECT_URI }}
          BAIDU_SCOPE: ${{ secrets.BAIDU_SCOPE }}
          # Developer ID signing (p12 exported from keychain)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization via App Store Connect API key (path set by Prepare step)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run release
