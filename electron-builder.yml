appId: com.lenohard.corner
productName: corner
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/.env'
  - '!**/.env.*'
  - '!**/*.tsbuildinfo'
  - '!src/**'
  - '!scripts/**'
  - '!local/**'
  - '!electron.vite.config.js'
  - '!tsconfig*.json'
  - '!electron-builder.yml'
  - '!**/{.DS_Store,Thumbs.db}'
extraResources:
  - from: scripts/corner-cli.mjs
    to: corner-cli.mjs
mac:
  category: public.app-category.music
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  target:
    - target: dmg
    - target: zip
  artifactName: corner-${version}-mac-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
  artifactName: corner-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: AudioVideo
  maintainer: lenohard <lenohard@users.noreply.github.com>
  target:
    - target: AppImage
    - target: deb
  artifactName: corner-${version}-linux-${arch}.${ext}
dmg:
  sign: false
  writeUpdateInfo: false
publish:
  provider: github
  owner: lenohard
  repo: macos-player
